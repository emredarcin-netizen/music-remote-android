name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android project
        run: unzip -q MusicRemoteAndroid_CloudBuild.zip -d project-src
      - name: Locate project and build APK
        shell: bash
        run: |
          PROJECT_DIR="$(find project-src -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: settings.gradle.kts not found in ZIP'
            find project-src -maxdepth 4 -type f
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/MusicRemote-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRemote-debug-apk
          path: MusicRemote-debug.apk
          if-no-files-found: error
          retention-days: 7
